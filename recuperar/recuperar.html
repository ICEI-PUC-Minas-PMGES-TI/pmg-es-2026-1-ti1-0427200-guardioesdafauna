<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="recuperar.css" />
</head>
<body>
    <div class="login-container">
        <img class="logo" src="logo.png" alt="Logo Guardiões da Fauna" />
        <h1>Recuperar senha</h1>
        <p>Informe seu CPF para redefinir a senha</p>

        <form id="recuperar-form">
            <div class="input-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required />
            </div>

            <div class="input-group">
                <label for="nova-senha">Nova senha</label>
                <input type="password" id="nova-senha" placeholder="Digite a nova senha" required />
            </div>

            <div class="input-group">
                <label for="confirmar-nova-senha">Confirmar nova senha</label>
                <input type="password" id="confirmar-nova-senha" placeholder="Repita a nova senha" required />
            </div>

            <button type="submit" class="btn-entrar">Redefinir</button>
            <a class="link-voltar" href="login/login.html">Voltar para o login</a>
        </form>
    </div>
</body>
</html>
