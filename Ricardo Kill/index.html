<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório das Onças</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>Amigos da Onça</h1>
        <p>Relatório de Monitoramento</p>
    </header>

    <main>

        <section class="controls">

            <input type="text" id="searchInput" placeholder="Pesquisar onça...">

            <select id="filterStatus">
                <option value="">Todos</option>
                <option value="Ativa">Ativa</option>
                <option value="Inativa">Inativa</option>
            </select>

            <button id="sortBtn">
                Ordenar por idade
            </button>

        </section>

        <section class="form-section">

            <h2>Cadastro de Onça</h2>

            <form id="oncaForm">

                <input type="hidden" id="oncaId">

                <input type="text" id="nome" placeholder="Nome" required>

                <input type="text" id="sexo" placeholder="Sexo" required>

                <input type="number" id="idade" placeholder="Idade" required>

                <input type="number" id="peso" placeholder="Peso" required>

                <input type="text" id="localizacao" placeholder="Localização" required>

                <input type="date" id="ultimaCaptura" required>

                <input type="text" id="status" placeholder="Status" required>

                <input type="text" id="imagem" placeholder="URL da imagem">

                <button type="submit">
                    Salvar
                </button>

            </form>

        </section>

        <section class="table-section">

            <h2>Relatórios</h2>

            <table>

                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>Nome</th>
                        <th>Sexo</th>
                        <th>Idade</th>
                        <th>Peso</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="oncasTable">

                </tbody>

            </table>

        </section>

        <section class="chart-section">

            <h2>Gráfico de Idade</h2>

            <canvas id="idadeChart"></canvas>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
