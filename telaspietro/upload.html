<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Upload de Imagens</title>
  <link rel="stylesheet" href="upload.css">
</head>
<body>

<h2>Upload de imagens das câmeras de segurança</h2>

<form id="formImagem" class="form-grid">

  <div class="campo">
    <label>Câmera</label>
    <select id="camera" required>
      <option value="">Carregando câmeras...</option>
    </select>
  </div>

  <div class="campo">
    <label>Data e Hora</label>
    <input type="datetime-local" id="dataHora" required>
  </div>

  <div class="campo">
    <label>Localização</label>
    <input type="text" id="localizacao" required>
  </div>

  <div class="campo">
    <label>Descrição</label>
    <input type="text" id="descricao">
  </div>

  <div class="campo full">
    <label>Imagem</label>
    <input type="file" id="imagem" required>
  </div>

  <div class="botoes full">
    <button type="submit" class="btn inserir">Inserir</button>
    <button type="button" onclick="limparForm()" class="btn limpar">Limpar</button>
  </div>

</form>

<hr>

<h3>Imagens cadastradas</h3>
<table border="1">
  <thead>
    <tr>
      <th>Câmera</th>
      <th>Data</th>
      <th>Arquivo</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<script src="upload.js"></script>
</body>
</html>
