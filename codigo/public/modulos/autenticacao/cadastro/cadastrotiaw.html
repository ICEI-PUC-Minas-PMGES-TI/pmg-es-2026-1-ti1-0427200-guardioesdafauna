<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastrotiaw.css" />
</head>
<body>
    <div class="login-container">
        <img class="logo" src="logo.png" alt="Logo Guardiões da Fauna" />
        <h1>Criar acesso</h1>
        <p>Preencha seus dados para criar acesso</p>

        <form id="cadastro-form">
            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required />
            </div>

            <div class="input-group">
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" placeholder="Digite seu sobrenome" required />
            </div>

            <div class="input-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required />
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required />
            </div>

            <div class="input-group">
                <label for="confirmar-senha">Confirmar Senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita a senha" required />
            </div>

            <button type="submit" class="btn-entrar">Cadastrar</button>
            <a class="link-voltar" href="../login/login.html">Voltar para o login</a>
        </form>
    </div>
</body>
</html>
