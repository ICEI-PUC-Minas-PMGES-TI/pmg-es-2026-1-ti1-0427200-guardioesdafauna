<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardiões da Fauna - ONGs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
                <i class="fas fa-paw me-2"></i> Guardiões da Fauna
            </a>
            
            <div class="d-flex align-items-center">
                <a href="#" class="nav-link active-link me-4 text-white fw-semibold">ONGs</a>
                <a href="#" class="btn btn-cadastro fw-semibold">Cadastrar ONG</a>
            </div>
        </div>
    </nav>

    <div class="search-section py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="search-box bg-white rounded shadow-sm d-flex align-items-center px-3 py-2">
                        <i class="fas fa-search text-muted me-2"></i>
                        <input type="text" id="input-busca" class="form-control border-0 shadow-none bg-transparent" placeholder="Buscar ONG por nome ou palavra-chave...">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5 mt-2">
        <div class="row">
            
            <div class="col-md-3 mb-4">
                <div class="filter-sidebar bg-white rounded shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold mb-0 text-dark d-flex align-items-center">
                            <i class="fas fa-filter text-success me-2"></i> Filtros
                        </h6>
                        <button id="btn-limpar" class="btn btn-link btn-sm text-decoration-none text-muted p-0 small">Limpar tudo</button>
                    </div>
                    <hr class="text-muted opacity-25">
                    
                    <div class="mb-4">
                        <label class="fw-bold text-muted small mb-2 d-flex align-items-center">
                            <i class="fas fa-map-marker-alt text-danger me-2"></i> REGIÃO
                        </label>
                        <select id="select-regiao" class="form-select shadow-none border-light-subtle">
                            <option value="todos" selected>Todos os Estados</option>
                            <option value="MG">Minas Gerais (MG)</option>
                            <option value="SP">São Paulo (SP)</option>
                            <option value="Nacional">Atuação Nacional</option>
                        </select>
                    </div>

                    <div>
                        <label class="fw-bold text-muted small mb-2 d-flex align-items-center">
                            <i class="fas fa-shield-alt text-secondary me-2"></i> TIPO DE APOIO
                        </label>
                        <div class="form-check mb-2">
                            <input class="form-check-input check-apoio shadow-none" type="checkbox" value="voluntariado" id="apoio-voluntariado">
                            <label class="form-check-label small" for="apoio-voluntariado">Voluntariado</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input check-apoio shadow-none" type="checkbox" value="monitoramento" id="apoio-monitoramento">
                            <label class="form-check-label small" for="apoio-monitoramento">Monitoramento de Campo</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input check-apoio shadow-none" type="checkbox" value="doacao" id="apoio-doacao">
                            <label class="form-check-label small" for="apoio-doacao">Doações</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="mb-4">
                    <h5 class="fw-bold text-dark">ONGs Parceiras <span id="contador-ongs" class="text-muted fw-normal fs-6">(0)</span></h5>
                </div>

                <div class="row" id="container-ongs"></div>

                <div id="sem-resultados" class="col-12 text-center py-5 d-none">
                    <p class="text-muted">Nenhuma ONG atende aos critérios selecionados.</p>
                </div>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
