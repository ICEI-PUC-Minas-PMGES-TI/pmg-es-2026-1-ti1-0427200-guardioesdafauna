<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amigos da Onça</title>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
  </head>
  <body>
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="sidebar-station">
        <div class="station-icon">
          <i class="ph ph-cactus" style="font-size: 24px"></i>
        </div>
        <div>
          <p class="station-title">ONG 01</p>
          <p class="station-sector">
            Lorem ipsum, dolor sit amet consectetur adipisicing elit. Enim
            obcaecati voluptatum ad consequuntur
          </p>
        </div>
      </div>

      <nav class="links">
        <a class="active">
          <i class="ph ph-map-trifold" style="font-size: 24px"></i>
          <span>Mapa</span>
        </a>
        <a>
          <i class="ph ph-camera" style="font-size: 24px"></i>
          <span>Câmeras</span>
        </a>
        <a>
          <i class="ph ph-users-three" style="font-size: 24px"></i>
          <span>ONGs</span>
        </a>
        <a>
          <i class="ph ph-cat" style="font-size: 24px"></i>
          <span>Onças</span>
        </a>
      </nav>

      <nav class="sidebar-footer" aria-label="Links secundários">
        <a>
          <i class="ph ph-info"></i>
          <span>Suporte</span>
        </a>
      </nav>
    </aside>

    <div class="content">
      <header class="app-header">
        <div>
          <p class="eyebrow">Amigos da Onça</p>
          <h1>Mapa de Câmeras</h1>
        </div>
        <div class="camera-section">
          <span id="camera-count">0 câmeras</span>
          <button id="add-camera"><span>+</span>Adicionar Câmera</button>
        </div>
      </header>

      <div class="search-wrapper">
        <div class="search-card">
          <div class="search-icon"><i class="ph ph-magnifying-glass"></i></div>
          <div class="search-input-wrapper">
            <input
              class="search-input"
              placeholder="Buscar câmera por ID ou Apelido"
              type="text"
            />
          </div>
        </div>
      </div>

      <div class="modal" id="camera-modal">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <p>Gerenciamento de Equipamento</p>
              <h2>Registrar Câmera</h2>
            </div>
            <span id="close" class="close">&times;</span>
          </div>

          <form id="create-camera-form">
            <div class="input-group">
              <label for="camera-id">Identificador único (ID)</label>
              <input
                id="camera-id"
                type="text"
                placeholder="ex.: CAM-JAG-001"
                required
              />
            </div>

            <div class="input-group">
              <label for="nickname">Apelido do dispositivo</label>
              <input
                id="nickname"
                type="text"
                placeholder="ex.: Ponto Norte 02"
                required
              />
            </div>

            <div class="input-row">
              <div class="input-group">
                <label for="x-coordinate">Coordenada X</label>
                <input
                  id="x-coordinate"
                  type="number"
                  placeholder="ex.: 19.873812"
                  step="any"
                  required
                />
              </div>

              <div class="input-group">
                <label for="y-coordinate">Coordenada Y</label>
                <input
                  id="y-coordinate"
                  type="number"
                  placeholder="ex.: 43.87932"
                  step="any"
                  required
                />
              </div>
            </div>

            <div class="input-row">
              <div class="input-group">
                <label for="battery-lifespan"
                  >Vida útil da bateria (em semanas)</label
                >
                <input
                  id="battery-lifespan"
                  type="number"
                  placeholder="ex.: 12"
                  required
                />
              </div>
              <div class="input-group">
                <label for="installation-date">Data de instalação</label>
                <input
                  id="installation-date"
                  type="date"
                  placeholder="ex.: 04/02/2026"
                  required
                />
              </div>
            </div>

            <div class="form-actions">
              <button type="button" id="cancel" class="cancel-button">
                Cancelar
              </button>
              <button class="save-button" type="submit">Salvar</button>
            </div>
          </form>
        </div>
      </div>

      <div id="map" aria-label="Mapa com localização das câmeras"></div>
      <main class="map-shell"></main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
