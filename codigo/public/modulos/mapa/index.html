<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amigos da Onça</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Amigos da Onça</p>
        <h1>Mapa de Câmeras</h1>
      </div>
      <div class="camera-section">
        <span id="camera-count" class="camera-count">0 câmeras</span>
        <button class="add-camera" id="add-camera">
          <span>+</span>Adicionar Câmera
        </button>
      </div>
    </header>

    <div class="modal" id="camera-modal">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <p>Gerenciamento de Equipamento</p>
            <h2>Registrar Câmera</h2>
          </div>
          <span id="close" class="close">&times;</span>
        </div>

        <form>
          <div class="input-group">
            <label for="camera-id">Identificador único (ID)</label>
            <input id="camera-id" type="text" placeholder="ex.: CAM-JAG-001" />
          </div>

          <div class="input-group">
            <label for="nickname">Apelido do dispositivo</label>
            <input
              id="nickname"
              type="text"
              placeholder="ex.: Ponto Norte 02"
            />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="x-coordinate">Coordenada X</label>
              <input
                id="x-coordinate"
                type="number"
                placeholder="ex.: 19.873812"
              />
            </div>

            <div class="input-group">
              <label for="y-coordinate">Coordenada Y</label>
              <input
                id="y-coordinate"
                type="number"
                placeholder="ex.: 43.87932"
              />
            </div>
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="battery-lifespan"
                >Vida útil da bateria (em semanas)</label
              >
              <input
                id="battery-lifespan"
                type="number"
                placeholder="ex.: 12"
              />
            </div>
            <div class="input-group">
              <label for="installation-date">Data de instalação</label>
              <input
                id="installation-date"
                type="date"
                placeholder="ex.: 04/02/2026"
              />
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="cancel" class="cancel-button">Cancelar</button>
            <button class="save-button" type="submit">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <div id="map" aria-label="Mapa com localização das câmeras"></div>
    <main class="map-shell"></main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
