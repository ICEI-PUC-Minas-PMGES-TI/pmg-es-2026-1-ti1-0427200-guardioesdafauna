<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa | Guardiões da Fauna</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../assets/css/app.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/sidebar.css" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <script src="../../assets/js/layout.js" defer></script>
    <script src="../../assets/js/login.js"></script>
  </head>
  <body data-root="../../" data-page="mapa">
    <aside data-app-sidebar></aside>

    <div class="app-content map-content">
      <header class="app-header">
        <div class="header-copy">
          <h2>Mapa de câmeras</h2>
          <p class="map-lede">Cadastre, localize e remova dispositivos ativos em campo.</p>
        </div>
        <div class="camera-section" aria-label="Resumo de câmeras">
          <span id="camera-count">0 câmeras</span>
          <button id="add-camera" type="button">
            <span aria-hidden="true" style="height: min-content;">+</span>Adicionar câmera
          </button>
        </div>
      </header>

      <div class="search-wrapper">
        <div class="search-card">
          <div class="search-icon"><i class="ph ph-magnifying-glass"></i></div>
          <div class="search-input-wrapper">
            <input
              id="camera-search"
              class="search-input"
              placeholder="Buscar câmera por ID ou apelido"
              type="search"
              aria-label="Buscar câmera por ID ou apelido"
              autocomplete="off"
            />
          </div>
        </div>
      </div>

      <div class="modal" id="camera-modal">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <p>Gerenciamento de Equipamento</p>
              <h2>Registrar Câmera</h2>
            </div>
            <span id="close" class="close">&times;</span>
          </div>

          <form id="create-camera-form">
            <div class="input-group">
              <label for="camera-id">Identificador único (ID)</label>
              <input
                id="camera-id"
                type="text"
                placeholder="ex.: CAM-JAG-001"
                required
              />
            </div>

            <div class="input-group">
              <label for="nickname">Apelido do dispositivo</label>
              <input
                id="nickname"
                type="text"
                placeholder="ex.: Ponto Norte 02"
                required
              />
            </div>

            <div class="input-row">
              <div class="input-group">
                <label for="x-coordinate">Latitude</label>
                <input
                  id="x-coordinate"
                  type="number"
                  placeholder="ex.: 19.873812"
                  step="any"
                  required
                />
              </div>

              <div class="input-group">
                <label for="y-coordinate">Longitude</label>
                <input
                  id="y-coordinate"
                  type="number"
                  placeholder="ex.: 43.87932"
                  step="any"
                  required
                />
              </div>
            </div>

            <div class="input-row">
              <div class="input-group">
                <label for="battery-lifespan"
                  >Vida útil da bateria (em semanas)</label
                >
                <input
                  id="battery-lifespan"
                  type="number"
                  placeholder="ex.: 12"
                  required
                />
              </div>
              <div class="input-group">
                <label for="installation-date">Data de instalação</label>
                <input
                  id="installation-date"
                  type="date"
                  placeholder="ex.: 04/02/2026"
                  required
                />
              </div>
            </div>

            <div class="form-actions">
              <button type="button" id="cancel" class="cancel-button">
                Cancelar
              </button>
              <button class="save-button" type="submit">Salvar</button>
            </div>
          </form>
        </div>
      </div>

      <div id="map" aria-label="Mapa com localização das câmeras"></div>
      <main class="map-shell"></main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
