<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uploads | Guardiões da Fauna</title>
    <link rel="stylesheet" href="../../assets/css/app.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/sidebar.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="../../assets/js/layout.js" defer></script>
    <script src="../../assets/js/login.js"></script>
  </head>
  <body data-root="../../" data-page="uploads">
    <aside data-app-sidebar></aside>
    <main class="page uploads-page">
      <header class="page-header">
        <div class="page-header__copy">
          <h2>Uploads e evidências</h2>
          <p class="lede">
            Envie arquivos vindos das câmeras, registre contexto operacional e
            acompanhe histórico com filtros.
          </p>
        </div>
        <div class="user-pill">
          <span>Usuário ativo</span>
          <strong id="userInfo"></strong>
        </div>
      </header>

      <section class="split-layout">
        <article class="panel">
          <h2>Novo upload</h2>
          <p>Arquivo processado com metadados para apoiar análise da equipe.</p>
          <form id="upload-form" class="form-grid">
            <div class="field">
              <label for="camera-select">Câmera</label>
              <select id="camera-select" required>
                <option value="">Carregando câmeras...</option>
              </select>
            </div>
            <div class="field">
              <label for="upload-datetime">Data e hora</label>
              <input id="upload-datetime" type="datetime-local" required />
            </div>
            <div class="field">
              <label for="upload-location">Localização</label>
              <input id="upload-location" type="text" placeholder="Trilha norte, setor 4..." required />
            </div>
            <div class="field">
              <label for="upload-status">Status inicial</label>
              <select id="upload-status">
                <option value="in-evaluation">Em avaliação</option>
                <option value="approved">Aprovado</option>
                <option value="rejected">Rejeitado</option>
              </select>
            </div>
            <div class="field field--full">
              <label for="upload-description">Descrição</label>
              <textarea id="upload-description" placeholder="Contexto do avistamento, clima, trilha, espécie estimada..."></textarea>
            </div>
            <div class="field field--full">
              <label for="upload-file">Arquivo</label>
              <input id="upload-file" type="file" accept="image/*,video/*,.pdf" required />
            </div>
            <div class="field field--full">
              <p id="upload-feedback" class="inline-note"></p>
            </div>
            <div class="field field--full">
              <div class="button-row">
                <button class="button-secondary" type="submit">Salvar upload</button>
                <button class="button-ghost" type="reset" id="reset-upload-form">Limpar</button>
              </div>
            </div>
          </form>
        </article>

        <article class="panel">
          <h2>Resumo</h2>
          <div class="chart-list" id="upload-summary"></div>
        </article>
      </section>

      <section style="margin-top: 22px" class="panel">
        <div class="uploads-header">
          <div>
            <h2>Histórico de uploads</h2>
            <p id="message" class="message"></p>
          </div>
        </div>

        <form class="filters-grid" id="filters-form">
          <div class="field">
            <label for="name-filter">Nome do arquivo</label>
            <input id="name-filter" type="search" placeholder="Filtrar por nome" />
          </div>

          <div class="field">
            <label for="camera-filter">Câmera</label>
            <select id="camera-filter">
              <option value="">Todas as câmeras</option>
            </select>
          </div>

          <div class="field">
            <label for="status-filter">Status</label>
            <select id="status-filter">
              <option value="">Todos</option>
              <option value="approved">Aprovado</option>
              <option value="in-evaluation">Em avaliação</option>
              <option value="pending">Pendente</option>
              <option value="rejected">Rejeitado</option>
            </select>
          </div>

          <div class="field">
            <label for="sort-filter">Ordenar por</label>
            <select id="sort-filter">
              <option value="date-desc">Data mais recente</option>
              <option value="date-asc">Data mais antiga</option>
              <option value="status-asc">Status A-Z</option>
              <option value="status-desc">Status Z-A</option>
            </select>
          </div>
        </form>

        <div class="button-row" style="margin: 18px 0 14px">
          <button id="clear-filters" class="button-ghost" type="button">Limpar filtros</button>
        </div>

        <div class="table-shell">
          <table class="uploads-table">
            <thead>
              <tr>
                <th>Arquivo</th>
                <th>Câmera</th>
                <th>Status</th>
                <th>Data</th>
                <th>Tamanho</th>
                <th>Contexto</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="uploads-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
