<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardiões da Fauna | Acesso</title>
    <link rel="stylesheet" href="../../assets/css/app.css" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="../../assets/js/login.js"></script>
  </head>

  <body class="auth-body">
    <main class="auth-page">
      <article class="auth-card auth-card--login" aria-label="Acesso">
        <p class="auth-card__tag">Guardiões da Fauna</p>
        <h1>Login</h1>
        <p class="auth-card__copy">Entre no sistema</p>

        <div id="loginMessage" class="status-message" hidden></div>

        <form id="login-form" class="auth-form">
          <label class="field">
            <span>Login</span>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Seu login"
              autocomplete="username"
              required
            />
          </label>

          <label class="field">
            <span>Senha</span>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            />
          </label>

          <button type="submit" class="button-primary">Entrar</button>
        </form>

        <button
          type="button"
          class="button-link"
          id="openRegisterModal"
          aria-haspopup="dialog"
          aria-controls="registerModal"
        >
          Criar conta
        </button>
      </article>
    </main>

    <div
      class="modal-backdrop"
      id="registerModal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="registerModalTitle"
    >
      <article class="auth-card auth-card--modal">
        <button
          type="button"
          class="modal-close"
          id="closeRegisterModal"
          aria-label="Fechar cadastro"
        >
          ×
        </button>

        <p class="auth-card__tag">Cadastro</p>
        <h2 id="registerModalTitle">Crie uma conta</h2>
        <p class="auth-card__copy">Registre um novo usuário.</p>

        <div id="registerMessage" class="status-message" hidden></div>

        <form id="register-form" class="auth-form">
          <label class="field">
            <span>Usuário</span>
            <input
              type="text"
              name="txt_login"
              id="txt_login"
              placeholder="Escolha um usuário"
              autocomplete="username"
              required
            />
          </label>

          <label class="field">
            <span>Nome completo</span>
            <input
              type="text"
              name="txt_nome"
              id="txt_nome"
              placeholder="Digite nome completo"
              autocomplete="name"
              required
            />
          </label>

          <label class="field">
            <span>E-mail</span>
            <input
              type="email"
              name="txt_email"
              id="txt_email"
              placeholder="usuario@guardioes.org"
              autocomplete="email"
              required
            />
          </label>

          <label class="field">
            <span>Senha</span>
            <input
              type="password"
              name="txt_senha"
              id="txt_senha"
              placeholder="Crie uma senha"
              autocomplete="new-password"
              required
            />
          </label>

          <label class="field">
            <span>Confirmar senha</span>
            <input
              type="password"
              name="txt_senha2"
              id="txt_senha2"
              placeholder="Repita sua senha"
              autocomplete="new-password"
              required
            />
          </label>

          <button type="submit" class="button-primary">Cadastrar</button>
        </form>
      </article>
    </div>

    <script>
      const registerModal = document.getElementById("registerModal");
      const openRegisterModalButton = document.getElementById("openRegisterModal");
      const closeRegisterModalButton = document.getElementById("closeRegisterModal");

      function openRegisterModal() {
        registerModal.hidden = false;
        document.body.classList.add("modal-open");
      }

      function closeRegisterModal() {
        registerModal.hidden = true;
        document.body.classList.remove("modal-open");
      }

      function setMessage(elementId, message, variant) {
        const element = document.getElementById(elementId);
        if (!element) {
          return;
        }

        element.hidden = false;
        element.className = `status-message status-message--${variant}`;
        element.textContent = message;
      }

      function displayMessage(message) {
        const isRegisterMessage =
          message.includes("Usuário inserido") || message.includes("Erro ao inserir");

        setMessage(
          isRegisterMessage ? "registerMessage" : "loginMessage",
          message,
          message.toLowerCase().includes("erro") ? "error" : "success"
        );
      }

      function processaFormLogin(event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const resultadoLogin = loginUser(username, password);

        if (resultadoLogin) {
          window.location.href = RETURN_URL;
          return;
        }

        setMessage("loginMessage", "Usuário ou senha incorretos.", "error");
      }

      function salvaLogin(event) {
        event.preventDefault();

        const login = document.getElementById("txt_login").value.trim();
        const nome = document.getElementById("txt_nome").value.trim();
        const email = document.getElementById("txt_email").value.trim();
        const senha = document.getElementById("txt_senha").value;
        const senha2 = document.getElementById("txt_senha2").value;

        if (senha !== senha2) {
          setMessage("registerMessage", "As senhas informadas nao conferem.", "error");
          return;
        }

        addUser(nome, login, senha, email);
        document.getElementById("register-form").reset();
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", processaFormLogin);

      document
        .getElementById("register-form")
        .addEventListener("submit", salvaLogin);

      openRegisterModalButton.addEventListener("click", openRegisterModal);
      closeRegisterModalButton.addEventListener("click", closeRegisterModal);

      registerModal.addEventListener("click", function (event) {
        if (event.target === registerModal) {
          closeRegisterModal();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !registerModal.hidden) {
          closeRegisterModal();
        }
      });
    </script>
  </body>
</html>
