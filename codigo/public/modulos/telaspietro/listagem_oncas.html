<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onças por ONG</title>
  <link rel="stylesheet" href="./listagem_oncas.css">
</head>
<body>

  <main class="container">

    <header class="topo">
      <div class="titulo-area">
        <div class="icone">🐾</div>
        <div>
          <h1>Onças por ONG</h1>
          <p>Visualize e gerencie as onças monitoradas por cada ONG parceira.</p>
        </div>
      </div>

      <button class="btn-nova">+ Nova ONG</button>
    </header>

    <section class="filtros">
      <input id="busca" type="text" placeholder="Buscar por nome da onça ou ONG...">

      <div>
    <label>ONG</label>

    <select id="filtroOng">
        <option value="Todas">Todas</option>
    </select>
</div>

      <div>
        <label>Status</label>
        <select id="filtroStatus">
          <option>Todos</option>
          <option>Ativa</option>
          <option>Monitorada</option>
          <option>Inativa</option>
        </select>
      </div>

      <button id="btnLimpar" class="btn-limpar">Limpar filtros</button>
    </section>

    <section class="conteudo">

      <div class="tabela-card">
        <table>
          <thead>
            <tr>
              <th>Onça</th>
              <th>ONG</th>
              <th>Idade</th>
              <th>Gênero</th>
              <th>Localização</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="corpoTabela"></tbody>
        </table>

        <div class="paginacao">
          <p>Mostrando 1 a 5 de 23 onças</p>

          <div class="paginas">
            <button>‹</button>
            <button class="atual">1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <span>...</span>
            <button>›</button>
          </div>
        </div>
      </div>

      <aside class="detalhes" id="painelDetalhes">
  <h2>Detalhes da Onça</h2>
  <p>Selecione uma onça para visualizar os detalhes.</p>
      </aside>

    </section>

  </main>
<script src="./listagem_oncas.js"></script>
</body>
</html>
