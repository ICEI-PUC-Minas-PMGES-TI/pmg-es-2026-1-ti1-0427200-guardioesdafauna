<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento da Fauna</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <img class="logo" src="logo.png" alt="Logo Amigos da Onça">
        <h1>Amigos da Onça</h1>
        <p> Monitorando e preservando a nossa fauna </p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <a class="link-esqueci" href="recuperar.html">Esqueci minha senha</a>

            <button type="submit" class="btn-entrar">Entrar</button>
            <a class="link-cadastro" href="cadastro.html">Cadastrar</a>
        </form>
    </div>
</body>
</html>
